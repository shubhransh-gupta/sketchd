name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          GITHUB_PAGES: true
          VITE_SITE_URL: https://shubhransh-gupta.github.io/sketchd
          VITE_DRAWINGS_RAW_BASE: https://raw.githubusercontent.com/shubhransh-gupta/sketchd-drawings/main/drawings
