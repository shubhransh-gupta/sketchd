name: Deploy Save API

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
  workflow_dispatch:

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Cloudflare credentials
        id: cf
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping Cloudflare deploy — set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets to enable."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - uses: actions/setup-node@v4
        if: steps.cf.outputs.configured == 'true'
        with:
          node-version: 22

      - name: Install worker dependencies
        if: steps.cf.outputs.configured == 'true'
        run: npm install
        working-directory: worker

      - name: Deploy Cloudflare Worker
        if: steps.cf.outputs.configured == 'true'
        run: npx wrangler deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Set GITHUB_TOKEN worker secret
        if: steps.cf.outputs.configured == 'true'
        run: |
          if [ -z "$DRAWINGS_REPO_TOKEN" ]; then
            echo "::notice::Skipping GITHUB_TOKEN secret — DRAWINGS_REPO_TOKEN not set."
            exit 0
          fi
          printf '%s' "$DRAWINGS_REPO_TOKEN" | npx wrangler secret put GITHUB_TOKEN
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DRAWINGS_REPO_TOKEN: ${{ secrets.DRAWINGS_REPO_TOKEN }}
